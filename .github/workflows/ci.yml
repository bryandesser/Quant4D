name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # Style options are in .flake8 at the repo root.
        # Only E999 (syntax), W605 (bad escapes) and F821 (undefined names)
        # are enforced during the initial port; everything else is suppressed
        # until incremental style cleanup PRs are merged.
        run: flake8 . --count --statistics

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyquant4d and pyright
        # the package's dependencies are installed so pyright sees numpy/matplotlib/PyQt5/h5py types;
        # pyright is pinned so a new release can't fail CI on unchanged code
        run: pip install -e . --config-settings editable_mode=compat && pip install pyright==1.1.414

      - name: Run pyright
        # settings in [tool.pyright] in pyproject.toml ("basic" mode, zero errors)
        run: pyright

  import-test:
    name: Import test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install virtual display (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 \
            xvfb x11-utils libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Install pyquant4d (no GPU extras)
        run: pip install -e . --config-settings editable_mode=compat

      - name: Verify core imports (Linux — with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python - <<'EOF'
          import pyquant4d.callbacks.appClass
          import pyquant4d.callbacks.allFunctions
          import pyquant4d.annotationsClasses.interactiveAnnulus
          print("Core imports OK")
          EOF

      - name: Verify core imports (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "
          import pyquant4d.callbacks.appClass
          import pyquant4d.callbacks.allFunctions
          import pyquant4d.annotationsClasses.interactiveAnnulus
          print('Core imports OK')
          "

      - name: Check entry point exists
        run: python -c "from pyquant4d.app import main; print('Entry point module OK')"

  test:
    name: Test suite (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install virtual display and Qt libs (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 \
            xvfb x11-utils libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      # Install the package first (pulls in PyQt6, numpy, etc. from pyproject.toml),
      # then add test-only extras explicitly. PyQt6 is listed separately as a
      # belt-and-suspenders measure in case editable-install resolution is incomplete.
      - name: Install pyquant4d + test dependencies
        run: pip install -e . --config-settings editable_mode=compat && pip install pytest pytest-qt pytest-cov pytest-mock tifffile h5py

      - name: Run test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pytest -m "not gpu" --junitxml=test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: pytest -m "not gpu" --junitxml=test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results-*.xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # GPU tests run only on pushes to main, on a self-hosted runner with CUDA.
  # To enable: add a runner tagged [self-hosted, gpu] in repo Settings → Actions.
  test-gpu:
    name: GPU tests
    runs-on: [self-hosted, gpu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
      - name: Install pyquant4d + test dependencies
        run: pip install -e . --config-settings editable_mode=compat && pip install pytest pytest-qt pytest-cov tifffile h5py
      - name: Run GPU tests
        # torch backend on cpu + cuda, and every detector mode through the app on GPU vs CPU
        run: pytest tests/unit/test_compute_torch.py tests/integration/test_gpu.py -v

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # Style options are in .flake8 at the repo root.
        # Only E999 (syntax), W605 (bad escapes) and F821 (undefined names)
        # are enforced during the initial port; everything else is suppressed
        # until incremental style cleanup PRs are merged.
        run: flake8 . --count --statistics

  import-test:
    name: Import test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Ensure the repo root is on PYTHONPATH so that all top-level packages
    # (callbacks/, annotationsClasses/, gui/) are importable regardless of
    # how pip resolves the editable-install sys.path in the given
    # setuptools/pip version combination on the runner.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt5 needs a virtual display on headless Linux runners
      - name: Install virtual display (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 \
            xvfb x11-utils libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Install pyquant4d (no GPU extras)
        # editable_mode=compat forces setuptools to write a .pth file for the
        # repo root (the pre-setuptools-64 behaviour), guaranteeing that all
        # top-level packages resolve even on runners with very recent tooling.
        run: pip install -e .

      - name: Verify core imports (Linux — with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python - <<'EOF'
          import callbacks.appClass
          import callbacks.allFunctions
          import annotationsClasses.interactiveAnnulus
          print("Core imports OK")
          EOF

      - name: Verify core imports (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "
          import callbacks.appClass
          import callbacks.allFunctions
          import annotationsClasses.interactiveAnnulus
          print('Core imports OK')
          "

      - name: Check entry point exists
        run: python -c "import Quant4D_app; print('Entry point module OK')"


# ---------------------------------------------------------------------------
# Testing routines
# ---------------------------------------------------------------------------

  test:
    name: Test suite (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ---- Linux only: virtual display for Qt ----------------------------
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 x11-utils

      # ---- Install package + test extras ---------------------------------
      - name: Install package
        run: pip install -e ".[dev,test]"

      # Minimal test extras not in pyproject.toml (add them there permanently)
      - name: Install test dependencies
        run: |
          pip install \
            pytest \
            pytest-qt \
            pytest-cov \
            pytest-mock \
            pytest-xdist \
            tifffile \
            h5py

      # ---- Run tests (Linux with Xvfb, others directly) ------------------
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          pytest tests/ \
            -m "not gpu" \
            --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Run tests (Windows / macOS)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ \
            -m "not gpu" \
            --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml

      # ---- Upload results ------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results-*.xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ---- GPU test job (self-hosted runner) ---------------------------------
  test-gpu:
    name: GPU tests
    runs-on: [self-hosted, gpu]   # requires a self-hosted runner with CUDA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Install package + test deps
        run: pip install -e ".[dev,test]" pytest pytest-qt pytest-cov tifffile h5py
      - name: Run GPU tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -m gpu -v

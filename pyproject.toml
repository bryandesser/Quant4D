[build-system]
requires = ["setuptools>=77", "wheel"]          # >=77: SPDX license expression
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name            = "quant4d"
version         = "0.4.1"
description     = "Python GUI for quantitative 4D-STEM data visualisation and analysis"
readme          = "README.md"
license         = "GPL-3.0-or-later"
license-files   = ["LICENSE"]
requires-python = ">=3.10"

authors = [
    { name = "Bryan Esser", email = "noreply@monash.edu" },
]

keywords = [
    "4D-STEM",
    "electron microscopy",
    "STEM",
    "diffraction",
    "centre-of-mass",
    "CoM",
    "iCoM",
    "dCoM",
    "DPC",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Core dependencies (GPU/torch is optional — see below)
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "psutil>=5.9",
    "Pillow>=9.5",
    "superqt>=0.4",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pandas>=1.5",
]

# ---------------------------------------------------------------------------
# Optional dependencies
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# GPU acceleration via PyTorch — install CUDA-enabled torch separately if needed.
# See https://pytorch.org/get-started/locally/ for the right wheel for your CUDA version.
gpu  = ["torch>=2.0"]
# py4DSTEM reader (legacy files) and quant4d.show(datacube); EMD files need only h5py
py4dstem = ["py4DSTEM>=0.14"]
# Full developer extras
dev  = [
    "torch>=2.0",
    "pytest>=7",
    "flake8>=6",
    "sphinx>=7",
    "furo",
    "myst-parser",
    "py4DSTEM>=0.14",
    "ipykernel",
]
docs = ["sphinx>=7", "furo", "myst-parser"]

# ---------------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------------
[project.scripts]
quant4d = "quant4d.app:main"

# ---------------------------------------------------------------------------
# URLs
# ---------------------------------------------------------------------------
[project.urls]
"Source Code"   = "https://github.com/bryandesser/Quant4D"
"Bug Tracker"   = "https://github.com/bryandesser/Quant4D/issues"
"Documentation" = "https://quant4d.readthedocs.io"

# ---------------------------------------------------------------------------
# Package discovery — src/ layout
# ---------------------------------------------------------------------------
# Everything is one package, src/quant4d (callbacks, annotationsClasses, gui, app): nothing
# else is installed at the top level of site-packages.
[tool.setuptools.packages.find]
where   = ["src"]
include = ["quant4d*"]

# Include .ui files and icon assets shipped inside the gui/ package.
[tool.setuptools.package-data]
"quant4d.gui" = ["*.ui", "icons/*", "icons/**/*"]

# ---------------------------------------------------------------------------
# Type checking (pyright, run in CI).  "basic" mode, zero errors required.
# torch is optional, so a missing torch is only a warning.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"

[pytest]
# ---------------------------------------------------------------------------
# pyQuant4D test configuration
# ---------------------------------------------------------------------------
testpaths = tests

# Qt platform: offscreen for headless CI; real display is detected locally
# (can be overridden by setting QT_QPA_PLATFORM in the shell)
addopts =
    --tb=short
    -q
    --strict-markers
    --cov=callbacks
    --cov=annotationsClasses
    --cov-report=term-missing
    --cov-report=xml:coverage.xml

markers =
    gpu:      "Requires a CUDA-capable GPU (auto-skipped otherwise)"
    slow:     "Long-running integration test; skip with -m 'not slow'"
    ui:       "Requires a live Qt application"

[pytest]
# ---------------------------------------------------------------------------
# pyQuant4D test configuration  (must live at the repo root)
# ---------------------------------------------------------------------------
testpaths = tests

addopts =
    --tb=short
    -q
    --strict-markers
    --cov=pyquant4d
    --cov-report=term-missing
    --cov-report=xml:coverage.xml

markers =
    gpu:  "Requires a CUDA-capable GPU (auto-skipped otherwise)"
    slow: "Long-running integration test; skip with -m 'not slow'"
    ui:   "Requires a live Qt application"

# Newer NumPy raises where older NumPy only warns: fail on the warning everywhere, so a test
# catches the problem whichever NumPy runs it (e.g. a one-element array passed as a number).
filterwarnings =
    error:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning
